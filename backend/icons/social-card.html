<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SQL Explorer social card</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 56px;
        box-sizing: border-box;
        padding: 0 96px 0 72px;
        background:
          radial-gradient(circle at 24% 50%, rgba(106, 169, 255, 0.16), transparent 42%),
          linear-gradient(160deg, #1b1f26, #101318);
        color: #e3e8ef;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      img {
        width: 400px;
        height: 400px;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      p {
        margin: 20px 0 36px;
        color: #9aa5b5;
        font-size: 34px;
        line-height: 1.3;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 20px;
        border: 2px solid #39404d;
        border-radius: 999px;
        background: #1b1f26;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <img src="source.svg" alt="" />
    <div>
      <h1>SQL Explorer</h1>
      <p>An open source SQL client for macOS, Windows and Linux</p>
      <ul>
        <li>MS SQL Server</li>
        <li>AWS Athena</li>
        <li>PostgreSQL</li>
        <li>MySQL</li>
        <li>MariaDB</li>
        <li>SQLite</li>
      </ul>
    </div>
  </body>
</html>
