[package]
name = "sql-explorer"
version = "0.2.0"
description = "A cross-platform desktop client for MS SQL Server, AWS Athena, MySQL, PostgreSQL and SQLite"
authors = ["Christopher Wetherill"]
license = "MIT"
repository = "https://github.com/wetherc/sql-explorer"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
env_logger = "0.11"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }

tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

# The TLS of `tiberius` runs on the library of the operating system, not on
# `rustls`. A SQL Server that offers only the older block ciphers, such as
# ECDHE_RSA_WITH_AES_256_CBC_SHA384, cannot speak to `rustls`, because `rustls`
# holds no such cipher and will not add one. The library of the system holds
# them, and so does every other client of MS SQL Server.
tiberius = { version = "0.12.3", default-features = false, features = [
    "chrono",
    "tds73",
    "native-tls",
    "sql-browser-tokio",
    "tokio",
    "tokio-util",
] }

mysql_async = { version = "0.37", default-features = false, features = [
    "rustls-tls",
    "chrono",
] }
# `mysql_async` compresses packets through `flate2`. Turning its default
# features off leaves `flate2` without a backend, so one is named here.
flate2 = { version = "1", features = ["rust_backend"] }

tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
tokio-postgres-rustls = "0.14"
postgres-types = { version = "0.2", features = ["derive"] }
rust_decimal = { version = "1", features = ["db-postgres"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
webpki-roots = "1"

rusqlite = { version = "0.40", features = ["bundled", "chrono", "column_decltype"] }

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-athena = "1"
aws-credential-types = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
] }
# Windows Integrated Security needs `winauth`, which builds on Windows only.
tiberius = { version = "0.12.3", default-features = false, features = ["winauth"] }

[target.'cfg(unix)'.dependencies]
# On a system that is not Windows, Integrated Security means Kerberos through
# GSSAPI. macOS carries the GSS framework and Linux carries the MIT or the
# Heimdal library, so the feature needs no extra package.
tiberius = { version = "0.12.3", default-features = false, features = [
    "integrated-auth-gssapi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", default-features = false, features = [
    "v1",
    "apple-native-keyring-store",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", default-features = false, features = [
    "v1",
    "zbus-secret-service-keyring-store",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
# A test of a time limit moves the clock of the runtime instead of waiting.
tokio = { version = "1", features = ["test-util"] }
# The probe under `examples/` prints the trace of `tiberius`, which uses
# `tracing` and not the `log` crate that the application itself uses.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# `tiberius` 0.12.3 holds each write of the TLS handshake in a buffer and sends
# it only when the caller flushes. A TLS library that the crate drives itself
# flushes, and the library of the operating system does not, so the first
# handshake message never left the machine and the connection waited until its
# time limit ran out. The copy under `vendor/` sends each write at once.
#
# The copy also asks for `libgssapi` 0.8.1 in place of the 0.4 that the release
# asks for. Release 0.4.6 builds a slice from the address of an empty GSSAPI
# buffer, which is undefined behaviour and stops a build that checks it. The
# same change is in the source of `tiberius` but not in any release.
[patch.crates-io]
tiberius = { path = "vendor/tiberius" }
